name: AgentScrumban
options:
  bundleIdPrefix: com.agentscrumban
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
packages:
  ScrumbanCore:
    path: Core
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: 0.10.0
targets:
  AgentScrumban:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/AppIcon.icns
    dependencies:
      - package: ScrumbanCore
        product: ScrumbanCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agentscrumban.AgentScrumban
        INFOPLIST_KEY_CFBundleDisplayName: agent-scrumban
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1"
  AgentScrumbanTests:
    type: bundle.unit-test
    platform: macOS
    sources: [AppTests]
    dependencies:
      - target: AgentScrumban
      - package: ViewInspector
        product: ViewInspector
  AgentScrumbanUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [AppUITests]
    dependencies:
      - target: AgentScrumban
